name: Market IQ
description: Market IQ is a predictive analytics platform for financial institutions,
  serving retail banking, investment banking, and capital markets. It ingests both
  structured and unstructured data, applies natural language processing and AI to
  generate insights, and delivers bespoke dashboards such as its Social Net Promoter
  Score and incident-monitoring tools. The company operates from Toronto, New York,
  and London and reaches customers through login-gated applications rather than a
  public developer API. Surfaced as a Techstars portfolio company and added to the
  API Evangelist network.
